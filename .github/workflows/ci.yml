name: Storefront E2E
run-name: >-
  ${{ github.event_name == 'pull_request'
    && format('Storefront PR #{0} at {1}', github.event.pull_request.number, github.event.pull_request.head.sha)
    || github.event.head_commit.message || github.workflow }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run.
        type: choice
        options: [storefront, users-api]
        default: storefront
      base_url:
        description: Storefront test URL. Defaults to the E2E_BASE_URL repository variable.
        type: string
        required: false
      users_api_url:
        description: Isolated Users API test URL. Defaults to E2E_USERS_API_URL.
        type: string
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check

  storefront:
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'ao-05-storefront-evidence') ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'storefront') ||
      (vars.E2E_BASE_URL != '' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository))
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ inputs.base_url || vars.E2E_BASE_URL || 'http://127.0.0.1:4317' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: test -n "$E2E_BASE_URL"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run storefront Playwright
        id: storefront_playwright
        run: |
          if [ "$E2E_BASE_URL" = 'http://127.0.0.1:4317' ]; then
            node --input-type=module <<'NODE' &
          import { createServer } from 'node:http';
          const list = '<h1>Smartphones</h1><app-store-phone-card data-product-id="demo"><h3>Demo phone</h3><span class="price">100 PLN</span><a href="/details/demo">View details for Demo phone</a></app-store-phone-card>';
          const detail = '<section aria-label="Demo phone"><h1>Demo phone</h1><span class="product-price">100 PLN</span></section><section aria-label="Specifications"><dl><dt>Storage</dt><dd>128 GB</dd></dl></section>';
          createServer((req, res) => {
            res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8' });
            res.end(req.url.startsWith('/details/') ? detail : list);
          }).listen(4317, '127.0.0.1');
          NODE
            fixture_pid=$!
            trap 'kill "$fixture_pid"' EXIT
            curl --fail --silent --retry 10 --retry-connrefused http://127.0.0.1:4317/list > /dev/null
          fi
          npm test
      - name: Record storefront evidence
        if: ${{ always() && (steps.storefront_playwright.outcome == 'success' || steps.storefront_playwright.outcome == 'failure') }}
        env:
          STOREFRONT_OUTCOME: ${{ steps.storefront_playwright.outcome }}
        run: node support/storefront-evidence.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.run_attempt == '1' && 'storefront-test-results' || format('storefront-test-results-attempt-{0}', github.run_attempt) }}
          path: TestResults/

  users-api:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'users-api'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_USERS_API_URL: ${{ inputs.users_api_url || vars.E2E_USERS_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: test -n "$E2E_USERS_API_URL"
      - run: npm ci
      - run: npm run test:users
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: users-api-test-results
          path: TestResults/
