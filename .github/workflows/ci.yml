name: Storefront E2E
run-name: >-
  ${{ github.event_name == 'pull_request'
    && format('Storefront PR #{0} at {1}', github.event.pull_request.number, github.event.pull_request.head.sha)
    || github.event.head_commit.message || github.workflow }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run.
        type: choice
        options: [storefront, users-api]
        default: storefront
      base_url:
        description: Storefront test URL. Defaults to the E2E_BASE_URL secret or variable.
        type: string
        required: false
      users_api_url:
        description: Isolated Users API test URL. Defaults to E2E_USERS_API_URL.
        type: string
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check

  storefront:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'storefront') ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ inputs.base_url || secrets.E2E_BASE_URL || vars.E2E_BASE_URL }}
      E2E_STOREFRONT_PRIVATE: ${{ !inputs.base_url && secrets.E2E_BASE_URL != '' }}
    steps:
      - name: Report missing storefront URL
        if: env.E2E_BASE_URL == ''
        run: |
          echo 'Set the E2E_BASE_URL secret or variable, or provide a base_url when dispatching.'
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then exit 1; fi
      - uses: actions/checkout@v4
        if: env.E2E_BASE_URL != ''
      - uses: actions/setup-node@v4
        if: env.E2E_BASE_URL != ''
        with:
          node-version: '24'
          cache: npm
      - name: Validate storefront URL
        if: env.E2E_BASE_URL != ''
        run: |
          node -e '
            const url = URL.parse(process.env.E2E_BASE_URL);
            if (!url || !["http:", "https:"].includes(url.protocol) || url.username || url.password) {
              console.error("E2E_BASE_URL must be an HTTP(S) URL without user information.");
              process.exit(1);
            }
            if (process.env.E2E_STOREFRONT_PRIVATE === "true") {
              console.log("::add-mask::" + url.hostname);
            }
          '
      - run: npm ci
        if: env.E2E_BASE_URL != ''
      - run: npx playwright install --with-deps chromium
        if: env.E2E_BASE_URL != ''
      - name: Run storefront Playwright
        id: storefront_playwright
        if: env.E2E_BASE_URL != ''
        run: npm test
      - name: Record storefront evidence
        id: storefront_evidence
        if: ${{ always() && (steps.storefront_playwright.outcome == 'success' || steps.storefront_playwright.outcome == 'failure') }}
        env:
          STOREFRONT_OUTCOME: ${{ steps.storefront_playwright.outcome }}
        run: node support/storefront-evidence.js
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.storefront_evidence.outcome == 'success' }}
        with:
          name: ${{ github.run_attempt == '1' && 'storefront-test-results' || format('storefront-test-results-attempt-{0}', github.run_attempt) }}
          path: |
            TestResults/storefront-evidence.json
            TestResults/allure-results/
            ${{ env.E2E_STOREFRONT_PRIVATE == 'false' && 'TestResults/playwright-*/' || '' }}

  users-api:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'users-api'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_USERS_API_URL: ${{ inputs.users_api_url || vars.E2E_USERS_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: test -n "$E2E_USERS_API_URL"
      - run: npm ci
      - run: npm run test:users
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: users-api-test-results
          path: TestResults/
